  <body>
    <main class="page">
      <section class="slider-wrapper">
        <div class="slider" aria-live="polite">
          <button class="nav prev" aria-label="Anterior">‹</button>
          <div class="slide">
            <img id="slider-image" src="images/1.jpg" alt="Imagen" />
          </div>
          <button class="nav next" aria-label="Siguiente">›</button>
        </div>

        <aside class="content">
          <h1 class="title">RETRATOS</h1>
          <h2 class="subtitle"></h2>

          <div class="controls-mobile">
            <button class="nav prev" aria-label="Anterior">‹</button>
            <button class="nav next" aria-label="Siguiente">›</button>
          </div>
        </aside>
      </section>
    </main>

    <!-- Intro overlay: reproduce media/intro.mp4 before starting the slider -->
    <div id="intro" class="intro" aria-hidden="false">
      <video id="intro-video" playsinline muted></video>
      <button id="skip-intro" class="skip">Saltar</button>
    </div>

    <script>
      (function(){
        const sources = ['media/intro.mp4','intro.mp4','video/intro.mp4'];
        const video = document.getElementById('intro-video');
        const container = document.getElementById('intro');
        const skip = document.getElementById('skip-intro');
        let loaded = false;

        function finish(){
          if(container){ container.style.display = 'none'; container.setAttribute('aria-hidden','true'); }
          window.dispatchEvent(new Event('introended'));
        }

        function trySource(i){
          if(i >= sources.length){ finish(); return; }
          const src = sources[i];
          video.src = src;
          video.load();
          const onLoaded = function(){ loaded = true; video.autoplay = true; video.muted = true; video.playsInline = true; video.play().catch(()=>{}); };
          const onError = function(){ video.removeEventListener('loadedmetadata', onLoaded); video.removeEventListener('error', onError); trySource(i+1); };
          video.addEventListener('loadedmetadata', onLoaded, { once:true });
          video.addEventListener('error', onError, { once:true });
        }

        video.addEventListener('ended', finish);
        skip.addEventListener('click', finish);
        trySource(0);
        setTimeout(()=>{ if(!loaded) finish(); }, 3000);
      })();
    </script>
